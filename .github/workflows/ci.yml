# Test key crates, build cross-architecture grok TUI binaries (x86_64 and arm64),
# and publish GitHub Releases with versioned assets.
name: CI

on:
  push:
    branches: [main, local-main, "local/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, local-main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTUP_TOOLCHAIN: "1.94.0"
  PROTOC: /usr/local/bin/protoc
  RUST_MIN_STACK: "16777216"

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      base_version: ${{ steps.ver.outputs.base_version }}
      sub_version: ${{ steps.ver.outputs.sub_version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          BASE_VERSION=$(grep -m1 '^version' crates/codegen/xai-grok-pager-bin/Cargo.toml | cut -d '"' -f2)
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            SUB_VERSION=""
          else
            SUB_VERSION="${{ github.run_number }}"
            VERSION="${BASE_VERSION}-sub.${SUB_VERSION}"
            TAG="v${VERSION}"
          fi
          echo "sub_version=${SUB_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION}, tag: ${TAG}"

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libclang-dev pkg-config libdbus-1-dev unzip ripgrep

      - name: Install protoc 29.3
        run: |
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip"
          sudo unzip -qo /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x64

      - name: Unit tests
        run: |
          cargo test --locked -p xai-grok-http --lib
          cargo test --locked -p xai-grok-update --lib
          cargo test --locked -p xai-grok-shell --lib
          cargo test --locked -p xai-grok-pager-bin --bins

  build:
    name: build-${{ matrix.name }}
    needs: [version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            arch: x86_64
            protoc_zip: protoc-29.3-linux-x86_64.zip
            cache_key: linux-x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            arch: aarch64
            protoc_zip: protoc-29.3-linux-aarch_64.zip
            cache_key: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libclang-dev pkg-config libdbus-1-dev unzip

      - name: Install protoc 29.3
        run: |
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${{ matrix.protoc_zip }}"
          sudo unzip -qo /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache_key }}

      - name: Release binary
        env:
          GROK_VERSION: ${{ needs.version.outputs.version }}
        run: cargo build --locked -p xai-grok-pager-bin --release

      - name: Package
        id: package
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          cp target/release/xai-grok-pager dist/grok
          chmod +x dist/grok
          ./dist/grok --version

          cp dist/grok "dist/grok-${VERSION}-${{ matrix.name }}"
          cp dist/grok "dist/grok-v${VERSION}-${{ matrix.name }}"
          cp dist/grok "dist/grok-${{ matrix.name }}"
          tar -czf "dist/grok-${VERSION}-${{ matrix.name }}.tar.gz" -C dist grok
          tar -czf "dist/grok-v${VERSION}-${{ matrix.name }}.tar.gz" -C dist grok
          tar -czf "dist/grok-${{ matrix.name }}.tar.gz" -C dist grok

          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            cp dist/grok "dist/grok-${VERSION}-linux-aarch64"
            cp dist/grok "dist/grok-v${VERSION}-linux-aarch64"
            cp dist/grok "dist/grok-linux-aarch64"
            tar -czf "dist/grok-${VERSION}-linux-aarch64.tar.gz" -C dist grok
            tar -czf "dist/grok-linux-aarch64.tar.gz" -C dist grok
          fi
          rm dist/grok

      - uses: actions/upload-artifact@v4
        with:
          name: grok-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  release:
    name: release
    needs: [version, build, test]
    if: github.ref == 'refs/heads/local-main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Prepare release assets
        id: rel_meta
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${{ needs.version.outputs.version }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          mkdir -p release-assets
          find dist-artifacts -type f -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum * > SHA256SUMS
          echo "=== Release Assets ==="
          ls -lah
          echo "=== Checksums ==="
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Grok Build ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
